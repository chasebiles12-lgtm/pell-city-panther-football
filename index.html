
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PELL CITY PANTHER FOOTBALL</title>
<style>
:root{--gold:#d4af37;--black:#0b0b0d;--card:#1b1b20}
*{box-sizing:border-box}
body{margin:0;background:var(--black);color:white;font-family:Arial,sans-serif}
header{background:linear-gradient(125deg,#101010,#382c10);padding:55px 20px;text-align:center;border-bottom:3px solid var(--gold)}
h1{font-size:clamp(32px,6vw,64px);color:var(--gold);margin:0;letter-spacing:2px}
header p{color:#ddd}
main{max-width:1150px;margin:auto;padding:24px 16px}
nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:18px}
button{background:#262626;border:1px solid #77652b;color:white;padding:11px 15px;border-radius:7px;cursor:pointer}
button.active,.gold{background:var(--gold);color:#111;font-weight:bold}
input{background:#202024;border:1px solid #555;color:white;padding:12px;border-radius:7px;width:100%;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:17px}
.card{background:var(--card);border:1px solid #48402b;border-radius:12px;padding:20px}
.card h2{color:var(--gold);margin:0 0 8px}
.number{color:var(--gold);font-weight:bold;font-size:30px}
.small{color:#aaa;font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.links a{background:#35312a;color:#f5d47a;text-decoration:none;padding:8px 11px;border-radius:6px;font-size:13px}
.panel{background:#18181c;border:1px solid #544626;padding:20px;border-radius:12px;margin:20px 0}
textarea{width:100%;min-height:280px;background:#111;color:#fff;border:1px solid #555;padding:12px}
footer{text-align:center;padding:30px;color:#aaa;border-top:1px solid #333}

.card{cursor:pointer;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}
.card .view{margin-top:14px;color:var(--gold);font-weight:700;font-size:14px}
.profile-back{margin:4px 0 18px}
.profile{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
.profile h2{font-size:clamp(27px,4vw,42px);margin:0;color:var(--gold)}
.profile .jersey{font-size:52px;font-weight:800;color:var(--gold)}
.profile .statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}
.stat{background:#27272d;padding:13px;border-radius:9px}
.stat span{display:block;color:#bdbdbd;font-size:12px;margin-bottom:5px}
.stat strong{font-size:18px}
.film-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#070707}
.film-placeholder{display:grid;place-items:center;aspect-ratio:16/9;background:#111;border:1px dashed #6b5a30;border-radius:8px;color:#bbb;text-align:center;padding:16px}
.profile .links a{font-size:15px;padding:12px}
.hint{font-size:13px;color:#bbb;line-height:1.5}
@media(max-width:750px){.profile{grid-template-columns:1fr}}

.player-photo{width:100%;height:220px;object-fit:cover;object-position:center 22%;border-radius:9px;margin-bottom:12px;background:#292929}
.photo-missing{height:220px;display:grid;place-items:center;background:linear-gradient(145deg,#282419,#101013);border:1px dashed #65562c;border-radius:9px;margin-bottom:12px;color:#c9b77b;font-weight:700}
.offer-logos{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:12px 0}
.offer-logo{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:8px;padding:5px}
.offer-label{font-size:12px;color:#ccc;margin:10px 0 4px}
.editor-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.editor-row label{font-size:13px;color:#ddd}
.editor-row input{margin:5px 0 12px}
.editor-offer{display:flex;gap:8px;align-items:center}
.editor-offer input{flex:1;min-width:0}
.editor-offer button{flex:none}
.editor-help{color:#bfbfbf;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<header>
<h1>PELL CITY PANTHER FOOTBALL</h1>
<p>Pell City High School | Alabama</p>
</header>
<nav id="tabs"></nav>
<main>
<input id="search" placeholder="Search players, positions, or jersey numbers..." oninput="render()">
<div id="content"></div>
</main>
<footer>PELL CITY PANTHERS | FOOTBALL RECRUITING</footer>
<script>
const initial=[
{name:"DJ Verges",number:"22",position:"LB",year:"2027",height:"6'2",weight:"230",gpa:"3.8",offers:"Troy, Arkansas State, FIU, UT Martin, Samford, ETSU",x:"VERGESDJ27"},
{name:"Hudson Bell",number:"71",position:"OL",year:"2027",height:"6'4",weight:"270",gpa:"4.4",offers:"Samford, North Alabama, Austin Peay",x:"HUDSONBELL09"},
{name:"Theon Williams",position:"DB/LB",year:"2027"},
{name:"JJ Hamby",position:"TE/WR",year:"2027"},
{name:"Parker Davis",position:"DL",year:"2027"},
{name:"Brody Gossett",position:"ATH",year:"2027"},
{name:"Devin Lovell",position:"OL",year:"2027"},
{name:"Juju Holland",position:"DB/LB",year:"2027"},
{name:"Aniff McFarlane",position:"DL",year:"2027"},
{name:"TJ Sanders",number:"2",position:"DB",year:"2028",height:"6'0",weight:"160",gpa:"2.9",offers:"Georgia State, ULM, Jacksonville State",x:"SANDERS_TJ7"},
{name:"Jamari Robinson",number:"70",position:"OL",year:"2028",height:"6'3",weight:"310",x:"JAMARIROB70"},
{name:"Brenon Saulter",number:"11",position:"WR",year:"2028",height:"6'2",weight:"195"},
{name:"Carter Hughes",number:"55",position:"OL",year:"2028",height:"6'4",weight:"280"},
{name:"Jaylen Bedford",number:"14",position:"DB/LB",year:"2028",height:"6'1",weight:"185"},
{name:"JT Turner",number:"7",position:"DB",year:"2028",height:"5'11",weight:"170"},
{name:"Gage Henley",number:"4",position:"DB",year:"2029",height:"6'4",weight:"185",hudl:"https://www.hudl.com/profile/18324750/Gage-Henley/highlights",maxpreps:"https://www.maxpreps.com/al/pell-city/pell-city-panthers/athletes/gage-henley/?careerid=4g8pkf5sa7il5"},
{name:"DJ Wade",number:"10",position:"ATH",year:"2029",height:"5'8",weight:"180"}
];
let players;
try{players=JSON.parse(localStorage.getItem("pc-roster"))||initial}
catch(e){players=initial}
let tab="2027";
let selectedPlayer=null;
let editingIndex=0;
const tabs=["2027","2028","2029","2030","Former Players","Coaches Contact","Edit Roster"];
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeURL(url){
try{let u=new URL(url);return ["https:","http:"].includes(u.protocol)?u.href:""}
catch(e){return ""}
}
function link(url,label){
let u=safeURL(url);
return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${label}</a>`:""
}
function setTab(t){tab=t;selectedPlayer=null;render()}
function render(){
document.getElementById("tabs").innerHTML=tabs.map(t=>`<button class="${tab===t?"active":""}" data-tab="${esc(t)}">${esc(t)}</button>`).join("");
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
const el=document.getElementById("content");
if(selectedPlayer!==null && tab!=="Edit Roster"){renderProfile(el);return}
if(tab==="Edit Roster"){
el.innerHTML=`<div class="panel"><h2>Edit Player Roster</h2><p>Changes save in this browser only. Export your updates to publish them for everyone.</p><textarea id="editor"></textarea><p><button class="gold" onclick="saveRoster()">Save in Browser</button> <button onclick="exportRoster()">Export JSON</button> <button onclick="document.getElementById('importFile').click()">Import JSON</button></p><input id="importFile" type="file" accept=".json" onchange="importRoster(event)"></div>`;
document.getElementById("editor").value=JSON.stringify(players,null,2);
renderPhotoEditor(el);
return
}
if(tab==="Coaches Contact"){
el.innerHTML='<div class="panel"><h2>Coaches Contact</h2><p>Recruiting staff contact information will be added here.</p></div>';return
}
const q=document.getElementById("search").value.toLowerCase();
let list=players.filter(p=>(tab==="Former Players"?p.year==="Former Players":p.year===tab)&&[p.name,p.position,p.number].join(" ").toLowerCase().includes(q));
el.innerHTML=`<h2>${tab==="Former Players"?"Former Players":"Class of "+esc(tab)}</h2><div class="grid">`+
(list.length?list.map(p=>`<article class="card" tabindex="0" role="button" data-profile="${esc(p.name)}" aria-label="View profile for ${esc(p.name)}">
${photoMarkup(p)}<div class="number">${esc(p.number?"#"+p.number:"")}</div>
<h2>${esc(p.name)}</h2>
<p>${esc(p.position||"Position pending")}</p>
<p class="small">${esc([p.height,p.weight?p.weight+" lbs":"",p.gpa?"GPA "+p.gpa:""].filter(Boolean).join(" | "))}</p>
${p.offers?`<p><strong>Reported offers:</strong> ${esc(p.offers)}</p>`:""}
${offerLogoMarkup(p)}
<div class="links">
${link(p.hudl,"Watch Hudl Film")}
${link(p.maxpreps,"MaxPreps")}
${p.x?link("https://x.com/"+encodeURIComponent(p.x.replace("@","")),"X Profile"):""}
</div><div class="view">View full profile →</div></article>`).join(""):'<p>No players listed yet.</p>')+"</div>";
el.querySelectorAll("[data-profile]").forEach(card=>{const open=()=>{selectedPlayer=players.find(p=>p.name===card.dataset.profile&&p.year===tab);render();window.scrollTo({top:0,behavior:"smooth"})};card.addEventListener("click",e=>{if(!e.target.closest("a"))open()});card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}})})
}


function imageURL(url){
const u=String(url||"").trim();
if(!u)return "";
if(/^(?:images|assets)\\/[a-zA-Z0-9_./%+ -]+\\.(?:png|jpg|jpeg|webp|gif|svg)$/i.test(u)&&!u.includes(".."))return u.split("/").map(encodeURIComponent).join("/");
return safeURL(u);
}
function photoMarkup(p){
const src=imageURL(p.photo);
return src?'<img class="player-photo" loading="lazy" src="'+esc(src)+'" alt="Photo of '+esc(p.name)+'" onerror="this.style.display=\'none\'">':'<div class="photo-missing">PLAYER PHOTO COMING SOON</div>';
}
function getOfferLogos(p){
return Array.isArray(p.offerLogos)?p.offerLogos.filter(o=>o&&o.school&&imageURL(o.logo)):[];
}
function offerLogoMarkup(p){
const logos=getOfferLogos(p);
return logos.length?'<div class="offer-label">COLLEGE OFFERS</div><div class="offer-logos">'+logos.map(o=>'<img class="offer-logo" loading="lazy" title="'+esc(o.school)+'" alt="'+esc(o.school)+' logo" src="'+esc(imageURL(o.logo))+'">').join("")+'</div>':"";
}
function renderPhotoEditor(el){
const panel=document.createElement("div");panel.className="panel";
panel.innerHTML='<h2>Player Photos & College Logos</h2><p class="editor-help">Upload photo files to the GitHub repository’s <strong>images</strong> folder first, then enter their paths below (example: images/dj-verges.jpg). This editor previews changes in your browser; it does not publish them for everyone.</p>'+
'<label for="photoPlayer">Choose player</label><select id="photoPlayer" style="width:100%;padding:12px;background:#222;color:white;border:1px solid #777;border-radius:7px"></select>'+
'<div class="editor-row"><label>Player photo path or URL<input id="photoPath" placeholder="images/player-name.jpg"></label></div>'+
'<h3>College Offer Logos</h3><div id="logoEditor"></div><button type="button" id="addOfferLogo">+ Add college logo</button>'+
'<p><button class="gold" type="button" id="savePlayerImages">Save image fields in browser</button></p>'+
'<p class="editor-help">For public updates, export your roster JSON and update the published website data. Do not treat browser-only changes as live.</p>';
el.appendChild(panel);
const select=panel.querySelector("#photoPlayer");
players.forEach((p,i)=>{const o=document.createElement("option");o.value=i;o.textContent=p.name+" ("+p.year+")";select.appendChild(o)});
editingIndex=Math.min(editingIndex,Math.max(0,players.length-1));select.value=editingIndex;
const logoEditor=panel.querySelector("#logoEditor");
function addLogoRow(school="",logo=""){
const row=document.createElement("div");row.className="editor-row";
row.innerHTML='<label>College name<input class="school" placeholder="College name"></label><label>Logo path or URL<input class="logo" placeholder="images/college-logo.png"></label><button type="button" class="remove-logo">Remove</button>';
row.querySelector(".school").value=school;row.querySelector(".logo").value=logo;
row.querySelector(".remove-logo").onclick=()=>row.remove();logoEditor.appendChild(row);
}
function load(){editingIndex=Number(select.value);const p=players[editingIndex];if(!p)return;panel.querySelector("#photoPath").value=p.photo||"";logoEditor.innerHTML="";(p.offerLogos||[]).forEach(o=>addLogoRow(o.school,o.logo))}
select.onchange=load;panel.querySelector("#addOfferLogo").onclick=()=>addLogoRow();
panel.querySelector("#savePlayerImages").onclick=()=>{
const p=players[editingIndex];if(!p)return;
p.photo=panel.querySelector("#photoPath").value.trim();
p.offerLogos=[...logoEditor.children].map(row=>({school:row.querySelector(".school").value.trim(),logo:row.querySelector(".logo").value.trim()})).filter(o=>o.school&&o.logo);
localStorage.setItem("pc-roster",JSON.stringify(players));
document.getElementById("editor").value=JSON.stringify(players,null,2);
alert("Saved in this browser only. Export your roster to prepare a public update.");
};load();
}

function hudlEmbed(url){
const u=safeURL(url);
if(!u)return "";
try{
const p=new URL(u);
if(!/(^|\\.)hudl\\.com$/.test(p.hostname))return "";
const m=p.pathname.match(/^\\/video\\/(\\d+)\\/(\\d+)\\/([a-zA-Z0-9_-]+)\\/?$/);
return m?"https://www.hudl.com/embed/video/"+m[1]+"/"+m[2]+"/"+m[3]:"";
}catch(e){return ""}
}
function renderProfile(el){
const p=selectedPlayer;
if(!p){selectedPlayer=null;render();return}
const details=[["POSITION",p.position],["HEIGHT",p.height],["WEIGHT",p.weight?p.weight+" lbs":""],["GPA",p.gpa],["CLASS",p.year]];
const film=hudlEmbed(p.hudl);
el.innerHTML='<button class="profile-back" id="backToRoster">← Back to Class of '+esc(p.year)+'</button>'+
'<div class="profile"><section class="panel">'+photoMarkup(p)+'<div class="jersey">'+esc(p.number?"#"+p.number:"")+'</div><h2>'+esc(p.name)+'</h2><p>Pell City High School · Alabama</p><div class="statgrid">'+
details.map(([k,v])=>'<div class="stat"><span>'+k+'</span><strong>'+esc(v||"—")+'</strong></div>').join("")+
'</div>'+(p.offers?'<h3>Reported College Offers</h3><p>'+esc(p.offers)+'</p><p class="hint">Offer information should be verified before sharing.</p>':'')+
+offerLogoMarkup(p)+'<div class="links">'+link(p.hudl,"▶ Watch on Hudl")+link(p.maxpreps,"MaxPreps Stats")+(p.x?link("https://x.com/"+encodeURIComponent(p.x.replace("@","")),"X / Twitter"):"")+'</div></section>'+
'<section class="panel"><h2>Highlight Film</h2>'+
(film?'<iframe class="film-frame" title="Hudl highlights for '+esc(p.name)+'" src="'+esc(film)+'" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>':
'<div class="film-placeholder">'+(p.hudl?"Open the linked Hudl profile to view this player's highlights.":"Hudl film link has not been added yet.")+'</div>')+
'<p class="hint">If the embedded video is unavailable or blocked by Hudl, use the Watch on Hudl button to open the original video.</p>'+
'<h3>Recruiting Links</h3><div class="links">'+link(p.hudl,"Hudl Highlights")+link(p.maxpreps,"MaxPreps Profile")+(p.x?link("https://x.com/"+encodeURIComponent(p.x.replace("@","")),"X Profile"):"")+'</div></section></div>';
document.getElementById("backToRoster").onclick=()=>{selectedPlayer=null;render()};
}

function saveRoster(){
try{
let data=JSON.parse(document.getElementById("editor").value);
if(!Array.isArray(data))throw Error("Roster must be an array");
players=data;localStorage.setItem("pc-roster",JSON.stringify(players));
alert("Saved in this browser. Export and publish the changes for visitors.");
render()
}catch(e){alert("Invalid roster JSON: "+e.message)}
}
function exportRoster(){
const blob=new Blob([JSON.stringify(players,null,2)],{type:"application/json"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);a.download="pell-city-roster.json";a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
function importRoster(e){
const file=e.target.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=()=>{
try{
const data=JSON.parse(reader.result);
if(!Array.isArray(data))throw Error("Invalid roster");
players=data;localStorage.setItem("pc-roster",JSON.stringify(players));render()
}catch(err){alert(err.message)}
};
reader.readAsText(file)
}
render();
</script>
</body>
</html>
